apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: control-plane
spec:
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80
