apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  # namespace is set by the provisioner at deploy time (project-<slug>)
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: config
          configMap:
            name: gateway-config
      containers:
        - name: gateway
          image: geehoo-gateway/gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: GATEWAY_PROJECT_ID
              # Set by provisioner to the project UUID at deploy time.
              # Do not use fieldRef: metadata.namespace — namespace != project id.
              value: ""
            - name: GATEWAY_CONFIG_PATH
              value: /etc/gateway/config.json
            - name: GATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: jwt-secret
            - name: GATEWAY_REDIS_URL
              value: redis://redis:6379
            - name: CONTROL_PLANE_INTERNAL_URL
              value: http://control-plane.control-plane.svc.cluster.local:4000
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: internal-service-secret
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
