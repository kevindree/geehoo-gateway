server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Admin / auth API → control plane
    # New URL scheme: gateway routes are /{workspaceSlug}/api/{projectSlug}/...
    # so /api/* is exclusively control-plane (auth, workspaces, invitations,
    # admin, end-users, etc).
    location /api/ {
        proxy_pass http://control-plane:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
